[package]
name = "tokimo-package-subtitle-download"
version = "0.1.0"
edition = "2024"
description = "聚合多源字幕搜索与下载"


[lib]
name = "tokimo_package_subtitle_download"
path = "src/lib.rs"

[[bin]]
name = "subtitle-aggregator"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
flate2 = "1"
hex = "0.4"
md-5 = "0.11"
regex = "1"
reqwest = { version = "0.13", features = ["json", "rustls", "cookies", "query", "stream", "form"] }
scraper = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.21"
sha1 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unrar = { package = "unrar-ng", version = "0.7" }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
xz2 = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
