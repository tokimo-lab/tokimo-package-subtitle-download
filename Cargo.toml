[package]
name = "tokimo-package-subtitle-download"
version = "0.1.0"
edition = "2024"
description = "聚合多源字幕搜索与下载"


[lib]
name = "tokimo_package_subtitle_download"
path = "src/lib.rs"

[[bin]]
name = "subtitle-aggregator"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
flate2 = "1"
hex = { workspace = true }
md-5 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["cookies", "query", "stream", "form"] }
scraper = "0.26"
serde = { workspace = true }
serde_json = { workspace = true }
sevenz-rust2 = "0.21"
sha1 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unrar = { package = "unrar-ng", version = "0.7" }
url = { workspace = true }
uuid = { workspace = true }
xz2 = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[lints]
workspace = true
